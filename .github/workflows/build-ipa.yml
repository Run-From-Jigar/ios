name: Build Unsigned iOS IPA
on:
  workflow_dispatch: # Allows you to manually trigger this build from GitHub

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode_version: 'latest-stable'

      - name: Compile App Bundle (No Code Signing)
        run: |
          xcodebuild clean build \
            -project *.xcodeproj \
            -scheme "Run From Jigar Stealing Ram" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into Payload for IPA
        run: |
          mkdir -p ipa_out/Payload
          cp -R build/Build/Products/Debug-iphoneos/*.app ipa_out/Payload/
          cd ipa_out
          zip -r "RunFromJigar.ipa" Payload

      - name: Upload IPA File to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Run-From-Jigar-IPA
          path: ipa_out/RunFromJigar.ipa

